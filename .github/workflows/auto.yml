name: auto-post

# v2 daily TOURNAMENT batch. One run/day mines many concepts, develops the
# strongest, fact-checks the finalists, posts the best `POSTS_PER_DAY`, and banks
# the rest as re-renderable recipes. The winners upload PRIVATE with a native
# YouTube `publishAt`, so YouTube auto-publishes them at the staggered times in
# PUBLISH_TIMES (interpreted in SCHEDULE_TZ, default UTC).
#
# Customize without editing this file via GitHub Variables in:
#   Settings -> Secrets and variables -> Actions -> Variables tab
#   POSTS_PER_DAY, PUBLISH_TIMES, SCHEDULE_TZ, CONTENT_NICHE, CONTENT_TONE, ...
#   (see README -> Customization for the full list)
#
# Drop a file at data/PAUSED (committed) to pause posting without disabling CI.
on:
  schedule:
    - cron: "0 12 * * *"   # one daily batch (12:00 UTC) — posts stagger later via publishAt
  workflow_dispatch:
    inputs:
      post:
        description: "How many to post this batch (blank = POSTS_PER_DAY)"
        default: ""
      dry_run:
        description: "Dry run: show the plan, post nothing (set to 'true')"
        default: ""

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-post
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build .env and restore YouTube token from secrets
        env:
          GEMINI_API_KEY:          ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:          ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN:           ${{ secrets.YOUTUBE_TOKEN }}
          FACEBOOK_PAGE_ID:        ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN:     ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          # ── Customizable via GitHub Variables (Settings -> Variables) ──────
          CONTENT_NICHE:           ${{ vars.CONTENT_NICHE      || 'AI and emerging technology, space and astronomy, UFOs/UAPs and the search for extraterrestrial life' }}
          CONTENT_TONE:            ${{ vars.CONTENT_TONE       || 'clear, punchy, plain-spoken explainer; smart and factual but neutral - no hype, no jokes' }}
          CLIP_SECONDS:            ${{ vars.CLIP_SECONDS        || '38' }}
          CLIP_SECONDS_MIN:        ${{ vars.CLIP_SECONDS_MIN    || '30' }}
          CLIP_SECONDS_MAX:        ${{ vars.CLIP_SECONDS_MAX    || '45' }}
          POSTS_PER_DAY:           ${{ vars.POSTS_PER_DAY       || '3' }}
          PUBLISH_TIMES:           ${{ vars.PUBLISH_TIMES       || '14:00,19:00,00:00' }}
          SCHEDULE_TZ:             ${{ vars.SCHEDULE_TZ         || 'UTC' }}
          TTS_VOICES:              ${{ vars.TTS_VOICES          || 'en-US-AndrewMultilingualNeural,en-US-BrianMultilingualNeural,en-US-ChristopherNeural,en-US-EricNeural,en-GB-RyanNeural,en-AU-WilliamNeural' }}
          SPECULATIVE_KEYWORDS:    ${{ vars.SPECULATIVE_KEYWORDS || 'ufo,ufos,uap,uaps,alien,aliens,extraterrestrial,flying saucer,close encounter,abduction,roswell,paranormal,cryptid' }}
        run: |
          mkdir -p secrets
          printf '%s' "$YOUTUBE_TOKEN" > secrets/youtube_token.json
          cat > .env <<EOF
          GEMINI_API_KEY=${GEMINI_API_KEY}
          GEMINI_MODEL=gemini-2.5-flash
          GEMINI_CALLS_MODEL=gemini-2.5-flash-lite
          GEMINI_FALLBACK_MODEL=gemini-2.5-flash-lite
          PEXELS_API_KEY=${PEXELS_API_KEY}
          TTS_VOICES=${TTS_VOICES}
          CONTENT_NICHE=${CONTENT_NICHE}
          CONTENT_TONE=${CONTENT_TONE}
          CLIP_SECONDS=${CLIP_SECONDS}
          CLIP_SECONDS_MIN=${CLIP_SECONDS_MIN}
          CLIP_SECONDS_MAX=${CLIP_SECONDS_MAX}
          POSTS_PER_DAY=${POSTS_PER_DAY}
          PUBLISH_TIMES=${PUBLISH_TIMES}
          SCHEDULE_TZ=${SCHEDULE_TZ}
          SPECULATIVE_KEYWORDS=${SPECULATIVE_KEYWORDS}
          YOUTUBE_TOKEN_FILE=secrets/youtube_token.json
          # Scheduling uploads as PRIVATE is required; YouTube flips them public at publishAt.
          YOUTUBE_PRIVACY=private
          FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID}
          FACEBOOK_PAGE_TOKEN=${FACEBOOK_PAGE_TOKEN}
          EOF

      - name: Run the daily tournament batch
        run: |
          if [ -f data/PAUSED ]; then echo "data/PAUSED present — skipping batch."; exit 0; fi
          POST="${{ github.event.inputs.post }}"
          DRY="${{ github.event.inputs.dry_run }}"
          ARGS=""
          if [ -n "$POST" ]; then ARGS="$ARGS --post $POST"; fi
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m socialbot.cli batch $ARGS

      - name: Persist dedup state + reserve recipes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/used_broll.json data/used_nasa.json data/used_topics.json \
                  data/used_commons.json data/last_voice.txt \
                  data/topic_bank.json data/strategy.json data/analytics.jsonl \
                  data/reserve 2>/dev/null || true
          # (reserve clips/scratch are gitignored, so only recipe meta.json is staged)
          git diff --cached --quiet || git commit -m "chore: update dedup state + reserve recipes [skip ci]"
          git push || true
